<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS icon grid: 824 px body centered on a 1024 canvas, with a soft drop shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset=".55" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#c04dff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a1a80" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <circle cx="512" cy="512" r="280" fill="url(#glass)" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
  <text x="512" y="520" font-family="-apple-system, 'SF Pro Display'" font-weight="500" font-size="400"
        fill="#fff" text-anchor="middle" dominant-baseline="central" filter="url(#glyphShadow)">⌘</text>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
</svg>
